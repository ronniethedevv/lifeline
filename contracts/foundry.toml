[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "london"  # per Mezo docs; T0.6 confirms with a real deploy
optimizer = true
optimizer_runs = 200
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 50 }
fs_permissions = [{ access = "read", path = "../deployments" }]
no_match_path = "test/fork/**"  # fork tests need shanghai: run with FOUNDRY_PROFILE=fork

# Fork tests against Mezo testnet. Mezo's own contracts use PUSH0, so forked execution
# needs shanghai; deployments stay on the default (london) profile until T0.6.
[profile.fork]
evm_version = "shanghai"
match_path = "test/fork/**"
no_match_path = "none"
fuzz = { runs = 50 }  # each fuzz run can hit the RPC

[rpc_endpoints]
mezo_testnet = "${MEZO_TESTNET_RPC}"
